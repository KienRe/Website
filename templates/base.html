<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock %}</title>
    <meta name="description" content="{{ config.description }}">
    
    <!-- Set background to prevent white flash when loading -->
    <style>
        html, body {
            background-color: #0f172a;
            margin: 0;
            padding: 0;
        }
    </style>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            font-size: 18px;
            line-height: 1.7;
        }
        
        html {
            overflow-y: scroll;
        }
        
        /* Typography */
        h1, h2, h3, h4 {
            color: #f1f5f9;
        }
        
        .text-muted {
            color: #94a3b8;
        }
        
        /* Navigation */
        .nav-link {
            color: #94a3b8;
            transition: color 0.2s ease;
        }
        
        .nav-link:hover {
            color: #22d3ee;
            outline: none;
        }
        
        .nav-link.active {
            color: #e2e8f0;
        }
        
        /* Links */
        .accent-link {
            color: #22d3ee;
            transition: color 0.2s ease;
        }
        
        .accent-link:hover {
            color: #06b6d4;
        }
        
        /* Cards */
        .section-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            transition: border-color 0.3s ease;
        }
        
        .section-card:hover {
            border-color: #475569;
        }
        
        .blog-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }
        
        .blog-card:hover {
            border-color: #22d3ee;
            transform: translateY(-2px);
        }
        
        /* Components */
        .accent-dot {
            background-color: #22d3ee;
        }
        
        .tech-tag {
            background-color: #334155;
            color: #94a3b8;
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            display: inline-block;
        }
        
        /* Media */
        video, img {
            border-radius: 0.5rem;
        }
    </style>
    {% block head %}{% endblock %}
    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://analytics.keenhour.eu/js/pa-CSAQ8m2tAAd66e7cORybu.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
    </script>
</head>
<body>
    <nav class="absolute top-0 right-0 p-8 z-50" aria-label="Main navigation">
        <div class="flex gap-8">
            <a href="{{ get_url(path='@/_index.md') }}" 
               class="nav-link {% if current_path == '/' %}active{% endif %} font-medium"
               {% if current_path == '/' %}aria-current="page"{% endif %}>
                Portfolio
            </a>
            <!--
            <a href="{{ get_url(path='@/blog/_index.md') }}" 
               class="nav-link {% if current_path is starting_with('/blog') %}active{% endif %} font-medium"
               {% if current_path is starting_with('/blog') %}aria-current="page"{% endif %}>
                Blog
            </a>
            {% set journal_section = get_section(path="journal/_index.md") %}
            {% if journal_section.pages %}
              {% set latest = journal_section.pages | first %}
              <a href="{{ latest.permalink }}" 
                 class="nav-link {% if current_path is starting_with('/journal') %}active{% endif %} font-medium"
                 {% if current_path is starting_with('/journal') %}aria-current="page"{% endif %}>
                  Journal
              </a>
              -->
            {% endif %}
        </div>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
