<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock %}</title>
    <meta name="description" content="{{ config.description }}">
    <link rel="preload" href="/fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-latin-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/app.css">
    <style>
        html, body { background-color: #0f172a; }
    </style>
    {% block head %}{% endblock %}
	<!-- Privacy-friendly analytics by Plausible -->
	<script async src="https://plausible.keenhour.eu/js/pa-gaGkA7K6KZJVIZFhB1P1G.js"></script>
	<script>
	window.plausible = window.plausible || function () { (plausible.q = plausible.q || []).push(arguments) };
	plausible.init = plausible.init || function (i) { plausible.o = i || {} };
	plausible.init({ endpoint: "https://plausible.keenhour.eu/api/event" });
	</script>
</head>
<body>
    <nav class="absolute top-0 right-0 p-8 z-50" aria-label="Main navigation">
        <div class="flex gap-8">
            <a href="{{ get_url(path='@/_index.md') }}" 
               class="nav-link {% if current_path == '/' %}active{% endif %} font-medium"
               {% if current_path == '/' %}aria-current="page"{% endif %}>
                Portfolio
            </a>
            <!--
            <a href="{{ get_url(path='@/blog/_index.md') }}" 
               class="nav-link {% if current_path is starting_with(pat='/blog') %}active{% endif %} font-medium"
               {% if current_path is starting_with(pat='/blog') %}aria-current="page"{% endif %}>
                Blog
            </a>
            {% set journal_section = get_section(path="journal/_index.md") %}
            {% if journal_section.pages %}
              {% set latest = journal_section.pages | first %}
              <a href="{{ latest.permalink }}" 
                 class="nav-link {% if current_path is starting_with(pat='/journal') %}active{% endif %} font-medium"
                 {% if current_path is starting_with(pat='/journal') %}aria-current="page"{% endif %}>
                  Journal
              </a>
              -->
            {% endif %}
        </div>
    </nav>
    {% block content %}{% endblock %}
    <script src="/js/lazy-video.js" defer></script>
</body>
</html>
