# The URL the site will be built for
base_url = "https://rkien.eu"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[markdown.highlighting]
# Replaces the old highlight_code / highlight_theme keys (removed in Zola 0.22+)
# base16-ocean-dark is gone; material-theme-ocean is the closest built-in dark theme
theme = "material-theme-ocean"

[extra]
title = "René Kienauer"
description = "Gameplay Programmer from Austria specializing in Unreal Engine"
author = "René Kienauer"
subtitle = "Gameplay Programmer"
