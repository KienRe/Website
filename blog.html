<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - René Kienauer</title>
	
	<!-- CRITICAL: Set background immediately to prevent white flash -->
    <style>
        html, body {
            background-color: #0f172a;
            margin: 0;
            padding: 0;
        }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="components.js" defer></script>
    <script src="blog-data.js" defer></script>
    <style>
		html {
			overflow-y: scroll; /* Always show vertical scrollbar */
		}
	
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            font-size: 18px;
            line-height: 1.7;
        }
        
        /* Matching dark theme styles */
        .nav-link {
            color: #94a3b8;
            transition: color 0.2s ease;
        }
        
        .nav-link:hover {
            color: #22d3ee;
        }
        
        .nav-link.active {
            color: #e2e8f0;
        }
        
        .blog-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }
        
        .blog-card:hover {
            border-color: #22d3ee;
            transform: translateY(-2px);
        }
        
        .accent-link {
            color: #22d3ee;
            transition: color 0.2s ease;
        }
        
        .accent-link:hover {
            color: #06b6d4;
        }
        
        h1, h2, h3 {
            color: #f1f5f9;
        }
        
        .text-muted {
            color: #94a3b8;
        }
    </style>
</head>
<body>

<!-- Matching navigation -->
<site-nav current="blog"></site-nav>

<!-- Simplified header -->
<page-header 
  title="Blog" 
  subtitle="Colletion of thoughts that might be useful to someone else then me">
</page-header>


<main class="px-8 pb-20">
    <div class="max-w-4xl mx-auto">
        <div id="blog-posts-container"></div>
    </div>
</main>
</body>
</html>
